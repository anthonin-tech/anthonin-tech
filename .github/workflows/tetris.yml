name: Tetris contributions

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours vers 4h (heure de Paris)
  workflow_dispatch:        # bouton "Run workflow" pour le lancer à la main
  push:                     # relance aussi quand on modifie ce workflow
    branches: [main]
    paths: [".github/workflows/tetris.yml"]

permissions:
  contents: write

jobs:
  tetris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le GIF Tetris
        env:
          # Commit épinglé du script debba/gh-contributions-tetris-gif-maker (MIT)
          TETRIS_SHA: f3d6dab7b58802f4e6f254856498fbc9f5a07774
        run: |
          git clone https://github.com/debba/gh-contributions-tetris-gif-maker.git /tmp/tetris
          cd /tmp/tetris
          git checkout --quiet "$TETRIS_SHA"
          pip install --quiet Pillow requests
          mkdir -p images
          python main.py -u "${{ github.repository_owner }}" -y "$(date +%Y)"
          # le script n'échoue jamais tout seul : on vérifie que le GIF existe
          test -s images/tetris_github.gif || { echo "GIF non généré"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/assets"
          cp images/tetris_github.gif "$GITHUB_WORKSPACE/assets/tetris.gif"

      - name: Commit du GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tetris.gif
          git diff --cached --quiet || git commit -m "🧱 Update Tetris GIF"
          git push
