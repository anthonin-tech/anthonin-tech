name: Tetris contributions

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours vers 4h (heure de Paris)
  workflow_dispatch:        # bouton "Run workflow" pour le lancer à la main
  push:                     # relance quand on modifie le workflow ou le générateur
    branches: [main]
    paths: [".github/workflows/tetris.yml", "scripts/tetris.py"]

permissions:
  contents: write

jobs:
  animations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le Tetris
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/tetris.py -u "${{ github.repository_owner }}" -o assets/tetris.svg

      - name: Commit des SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet || git commit -m "🧱 Update Tetris"
          git push
